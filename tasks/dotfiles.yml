- name: Set fact for dotfiles path
  ansible.builtin.set_fact:
    # NOTE: Do keep the slash at the end!
    dotfiles_path: "{{ ansible_env.PWD }}/files/dotfiles/"

- name: Find all dotfiles directories
  ansible.builtin.find: &findParams
    paths: "{{ dotfiles_path }}"
    file_type: directory
    recurse: true
    hidden: true
  register: dotfiles_directories

- name: Ensure paths for dotfiles exist
  ansible.builtin.file:
    path: "~/{{ item.path | replace(dotfiles_path, '') }}"
    state: directory
    mode: u=rwx,go=rx
  with_items: "{{ dotfiles_directories.files }}"

- name: Find all dotfiles to be linked
  ansible.builtin.find:
    <<: *findParams
    file_type: file
  register: dotfiles

- name: Symlink dotfiles
  ansible.builtin.file:
    src: "{{ item.path }}"
    dest: "~/{{ item.path | replace(dotfiles_path, '') }}"
    state: link
    force: true
  with_items: "{{ dotfiles.files }}"

# The file-by-file symlinks above cannot share one tracked directory between two profiles.
# Link per skill because ~/.claude-personal/skills/synced is managed by Claude Code.
- name: Ensure personal Claude skills directory exists
  ansible.builtin.file:
    path: ~/.claude-personal/skills
    state: directory
    mode: u=rwx,go=rx

- name: Share Claude skills with personal profile
  ansible.builtin.file:
    src: "{{ dotfiles_path }}.claude/skills/{{ item }}"
    dest: "~/.claude-personal/skills/{{ item }}"
    state: link
  with_items:
    - plan-canvas
