# See https://github.com/oxsecurity/megalinter/blob/v10.1.0/TEMPLATES/mega-linter.yml
# MegaLinter GitHub Action configuration file
# More info at https://megalinter.io
name: MegaLinter

on:
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest

    # Let the reporters comment on pull requests.
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:

      # Git Checkout
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

          # MegaLinter needs the history to diff against main.
          fetch-depth: 0

      # MegaLinter
      - name: MegaLinter

        # The documentation flavor covers all linters of this repo except Lua.
        # More info at https://megalinter.io/latest/flavors/
        uses: oxsecurity/megalinter/flavors/documentation@f2fe8c1cba37091848df3e524066c8c23ef353ed # v10

        # All available variables are described in documentation
        # https://megalinter.io/latest/configuration/
        env:

          # Only lint the git diff with main.
          VALIDATE_ALL_CODEBASE: false

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload MegaLinter artifacts
      - name: Archive production artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: success() || failure()
        with:
          name: MegaLinter reports
          include-hidden-files: "true"
          path: |
            megalinter-reports
            mega-linter.log
